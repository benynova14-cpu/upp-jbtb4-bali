name: Replace UPP JBTB 4 logo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace-logo:
    if: github.event.head_commit.message != 'Apply new UPP JBTB 4 logo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install replacement logo
        run: |
          base64 -d assets/upp-jbtb4-logo.webp.b64 > assets/upp-jbtb4-logo.webp
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* UPP JBTB 4 replacement logo */'
          css='''<style>/* UPP JBTB 4 replacement logo */\n.logo{background:url(\'assets/upp-jbtb4-logo.webp\') center/cover no-repeat!important;overflow:hidden}\n.logo:before,.logo:after{display:none!important}\n</style>'''
          if marker not in s:
              s=s.replace('</head>',css+'</head>')
              p.write_text(s,encoding='utf-8')
          PY
          rm -f assets/upp-jbtb4-logo.webp.b64 assets/upp-jbtb4-logo.webp.b64 assets/placeholder.txt
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/upp-jbtb4-logo.webp assets/placeholder.txt assets/upp-jbtb4-logo.webp.b64
          git diff --cached --quiet || git commit -m 'Apply new UPP JBTB 4 logo'
          git push
