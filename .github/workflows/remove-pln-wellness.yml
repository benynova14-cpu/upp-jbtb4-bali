name: Remove PLN Wellness references

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove PLN Wellness narratives
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove all visible/HTML narrative references, regardless of capitalization.
          s = re.sub(r'PLN\s+WELLNESS', '', s, flags=re.IGNORECASE)
          s = re.sub(r'pln-wellness-banner\.svg', 'assets/upp-jbtb4-logo.webp', s, flags=re.IGNORECASE)
          s = s.replace('<title>UPP JBTB 4 Bali • </title>', '<title>UPP JBTB 4 Bali • Information Hub</title>')
          s = s.replace(' •  • ', ' • ')
          s = s.replace('••', '•')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove PLN Wellness narratives [skip wellness]'
          git push
