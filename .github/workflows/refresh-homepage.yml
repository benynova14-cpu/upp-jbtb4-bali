name: Refresh UPP JBTB 4 homepage
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[skip refresh]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fresh homepage design
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>UPP JBTB 4 Bali • PLN Wellness</title>','<title>UPP JBTB 4 Bali • Information Hub</title>')
          s=re.sub(r'<div class="intro" id="intro">.*?</div>\s*<header>', '<header>', s, flags=re.S)
          s=s.replace('<div class="brand"><div class="mark">4</div><div><b>UPP JBTB 4</b><small>BALI</small></div></div>', '<div class="brand"><img src="assets/upp-jbtb4-logo.webp" alt="Logo UPP JBTB 4"><div><b>UPP JBTB 4</b><small>BALI</small></div></div>')
          s=re.sub(r'<main id="top"><section class="hero">.*?</section>\s*<div class="cards">', '''<main id="top"><section class="hero"><div class="hero-inner"><div class="hero-copy"><span class="tag">UPP JBTB 4 • BALI</span><h1>Selamat Datang di UPP JBTB 4 Bali</h1><p>Pusat informasi, layanan, rekomendasi sekitar, dan ruang digital untuk mendukung kebutuhan pegawai serta tamu di Bali.</p><div class="hero-actions"><a class="btn" href="#profil">LIHAT PROFIL ›</a><a class="btn secondary" href="#kontak">KONTAK & LAYANAN</a></div></div><div class="hero-info"><b>UPP JBTB 4 Bali</b><small>Information Hub untuk profil, layanan kantor, hotel, kuliner, wisata dan kebutuhan tamu.</small><strong>📍 Bali, Indonesia</strong></div></div></section>
<div class="cards">''', s, flags=re.S)
          s=re.sub(r'<div class="cards">.*?</div>\s*<div class="content">', '''<div class="cards"><a class="card" href="#profil"><div class="ico">👥</div><h3>Profil UPP JBTB 4</h3><p>Visi, misi, tugas dan struktur organisasi.</p></a><a class="card" href="#pengunjung"><div class="ico">📊</div><h3>Pengunjung</h3><p>Jumlah kunjungan website.</p><strong id="visitorCard">—</strong></a><a class="card" href="#hotel"><div class="ico">🏨</div><h3>Hotel</h3><p>Pilihan hotel bintang 3 ke atas.</p></a><a class="card" href="#kuliner"><div class="ico">🍽️</div><h3>Kuliner</h3><p>Rekomendasi kuliner Bali.</p></a><a class="card" href="#wisata"><div class="ico">🌴</div><h3>Wisata</h3><p>Destinasi menarik sekitar Bali.</p></a><a class="card" href="#kontak"><div class="ico">☎️</div><h3>Kontak & Layanan</h3><p>Hubungi kami untuk informasi.</p></a></div>
<div class="content">''', s, count=1, flags=re.S)
          s=s.replace('© 2026 UPP JBTB 4 Bali • PLN Wellness • Information Hub','© 2026 UPP JBTB 4 Bali • PT PLN (Persero) • Information Hub')
          s=re.sub(r'<div class="music">.*?</div>\s*<script>', '''<div class="audio"><div class="music-icon">🎵</div><div><b>Suara Balinese Gamelan</b><small>Otomatis aktif saat interaksi pertama • dapat diatur volumenya</small></div><div class="equalizer" id="eq"><i></i><i></i><i></i><i></i><i></i></div><button id="playBtn" aria-label="Putar gamelan">▶</button><input id="volume" type="range" min="0" max="1" step="0.05" value="0.35" aria-label="Volume gamelan"></div><audio id="gamelanAudio" preload="auto" loop src="assets/gamelan.wav"></audio>
<script>''', s, count=1, flags=re.S)
          s=re.sub(r'<script>.*?</script>\s*<script data-gamelan-v2>.*?</script>\s*</body>', '''<script>
async function countVisit(){const a=document.getElementById('visitors'),b=document.getElementById('visitorCard');if(!a)return;try{const r=await fetch('https://api.counterapi.dev/v1/upp-jbtb4-bali/visits/up');const j=await r.json();const n=Number(j?.count||j?.value||0);a.textContent=n.toLocaleString('id-ID');b.textContent=n.toLocaleString('id-ID')}catch(e){const n=Number(localStorage.getItem('uppVisitors')||0)+1;localStorage.setItem('uppVisitors',n);a.textContent=n.toLocaleString('id-ID');b.textContent=n.toLocaleString('id-ID')}}countVisit();
function sendMail(){const n=encodeURIComponent(document.getElementById('nama').value),p=encodeURIComponent(document.getElementById('pesan').value);location.href=`mailto:?subject=Kontak UPP JBTB 4&body=Nama: ${n}%0A%0A${p}`}
const audio=document.getElementById('gamelanAudio'),btn=document.getElementById('playBtn'),eq=document.getElementById('eq'),vol=document.getElementById('volume');if(audio){audio.volume=.35;function playGamelan(){audio.play().then(()=>{btn.textContent='❚❚';eq.classList.add('playing')}).catch(()=>{})}function pauseGamelan(){audio.pause();btn.textContent='▶';eq.classList.remove('playing')}btn.addEventListener('click',()=>audio.paused?playGamelan():pauseGamelan());vol.addEventListener('input',()=>audio.volume=Number(vol.value));let started=false;function firstInteraction(){if(started)return;started=true;playGamelan()}['pointerdown','keydown','touchstart'].forEach(e=>document.addEventListener(e,firstInteraction,{once:true,passive:true}))}
</script></body>''', s, count=1, flags=re.S)
          extra='''<style id="fresh-homepage-v16">.brand img{width:48px;height:48px;border-radius:13px;object-fit:cover;box-shadow:0 6px 20px #ffd40055}.hero{min-height:550px;position:relative;display:flex;align-items:flex-end;padding:0 4.5% 32px;overflow:hidden;background-image:linear-gradient(180deg,#0a75d900 35%,#042c62cc 100%),url('https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=2200&q=90');background-position:center;background-size:cover}.hero:after{content:"";position:absolute;left:-5%;right:-5%;bottom:-48px;height:105px;background:linear-gradient(100deg,#ffd400,#18c7e8,#075fd7);clip-path:polygon(0 38%,15% 68%,34% 40%,55% 75%,75% 42%,100% 65%,100% 100%,0 100%);opacity:.96}.hero-inner{position:relative;z-index:2;width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}.hero-copy{max-width:650px;color:#fff;text-shadow:0 3px 16px #001b3dcc}.hero-copy .tag{display:inline-block;padding:8px 12px;border-radius:999px;background:#fff;color:#075fd7;font-weight:900;font-size:11px;letter-spacing:.08em;text-shadow:none}.hero-copy h1{font-size:clamp(36px,5vw,64px);line-height:1.02;margin:14px 0 10px}.hero-copy p{font-size:16px;line-height:1.65;max-width:610px;margin:0;color:#f7fbff}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.hero-info{min-width:255px;padding:18px;border-radius:20px;background:#ffffffe8;color:#102b4a;box-shadow:0 18px 45px #001b3c33}.hero-info b{display:block;color:#075fd7;font-size:16px}.hero-info small{display:block;color:#667b91;line-height:1.55;margin-top:6px}.hero-info strong{display:block;margin-top:12px}.cards{grid-template-columns:repeat(6,1fr);padding:18px 2.5%}.audio{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:20px;background:#fff;border:1px solid #dfeaf4;box-shadow:0 12px 35px #123b6510}.audio .music-icon{font-size:30px}.audio b{display:block}.audio small{color:#667b91}.audio button{margin-left:auto;border:0;width:44px;height:44px;border-radius:50%;background:#075fd7;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 8px 20px #075fd744}.audio input{width:120px}.equalizer{display:flex;gap:3px;align-items:end;height:26px}.equalizer i{width:4px;background:#ffd400;border-radius:3px;height:8px}.equalizer.playing i{animation:eq .55s infinite alternate}.equalizer.playing i:nth-child(2){animation-delay:.1s}.equalizer.playing i:nth-child(3){animation-delay:.2s}.equalizer.playing i:nth-child(4){animation-delay:.3s}.equalizer.playing i:nth-child(5){animation-delay:.4s}@keyframes eq{to{height:25px}}@media(max-width:1150px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.hero{min-height:620px;padding:0 18px 30px}.hero-inner{display:block}.hero-copy{padding-bottom:20px}.hero-copy h1{font-size:40px}.hero-copy p{font-size:13px}.hero-info{display:none}.cards{grid-template-columns:repeat(2,1fr);padding:12px}.audio{flex-wrap:wrap}.audio button{margin-left:0}}@media(max-width:460px){.cards{grid-template-columns:1fr}.hero-copy h1{font-size:34px}.hero-actions .btn{width:100%;text-align:center}.audio input{width:100%}}</style>'''
          s=s.replace('</head>',extra+'\n</head>')
          p.write_text(s,encoding='utf-8')
      - name: Commit refreshed homepage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Refresh UPP JBTB 4 homepage [skip refresh]'
          git push
