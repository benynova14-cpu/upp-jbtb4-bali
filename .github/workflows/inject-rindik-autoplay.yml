name: Enable Rindik first-click autoplay

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject autoplay helper into index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="assets/rindik-autoplay.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
                  p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable Rindik music on first page click [skip ci]"
          git push
