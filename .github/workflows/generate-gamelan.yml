name: Generate Balinese Gamelan Audio
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audio:
    if: "!contains(github.event.head_commit.message, '[skip gamelan audio]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate lightweight gamelan-inspired loop
        shell: python
        run: |
          import math, random, wave
          from pathlib import Path
          sr=22050; dur=8; n=int(sr*dur); y=[0.0]*n
          notes=[261.63,293.66,329.63,392.0,440.0,523.25,587.33]
          for k in range(int(dur/0.5)):
            tt=k*0.5; f=notes[k%len(notes)]
            for j in range(int(0.42*sr)):
              i=int(tt*sr)+j
              if i>=n: break
              x=j/sr; env=math.exp(-6*x)
              y[i]+=0.20*env*(math.sin(2*math.pi*f*x)+0.34*math.sin(2*math.pi*2.01*f*x)+0.12*math.sin(2*math.pi*3.98*f*x))
          for tt in (0,4):
            for j in range(int(1.6*sr)):
              i=int(tt*sr)+j
              if i>=n: break
              x=j/sr; y[i]+=0.25*math.exp(-2.4*x)*math.sin(2*math.pi*130*x)
          random.seed(7)
          for k in range(int(dur/0.5)):
            tt=k*0.5+0.25
            for j in range(int(0.08*sr)):
              i=int(tt*sr)+j
              if i>=n: break
              x=j/sr; y[i]+=0.025*math.exp(-35*x)*random.uniform(-1,1)
          peak=max(abs(v) for v in y) or 1
          data=bytearray()
          for v in y:
            v=max(-1,min(1,math.tanh(v*1.8/peak)))
            q=int(v*32767); data += int(q).to_bytes(2,'little',signed=True)
          out=Path('assets/gamelan.wav'); out.parent.mkdir(exist_ok=True)
          with wave.open(str(out),'wb') as w:
            w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr); w.writeframes(data)
      - name: Commit audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/gamelan.wav
          git diff --cached --quiet || git commit -m 'Add Balinese Gamelan audio [skip gamelan audio]'
          git push
