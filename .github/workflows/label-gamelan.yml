name: Set Balinese Gamelan label

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-label:
    if: "!contains(github.event.head_commit.message, '[skip gamelan]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change music label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Instrument Bali • otomatis', 'Suara Balinese Gamelan')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Set music label to Balinese Gamelan [skip gamelan]'
          git push
