name: Apply uploaded UPP logo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply uploaded logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker='</head>'
          css='''<style id="uploaded-upp-logo">
          .logo{background-image:url("assets/upp-jbtb4-logo.webp") !important;background-size:cover !important;background-position:center !important;background-repeat:no-repeat !important;box-shadow:inset 0 0 25px #fff8,0 0 30px #ffd400,0 0 100px #08aaffaa !important;}
          .logo:before,.logo:after{content:none !important;display:none !important;}
          .introbox .logo{background-image:url("assets/upp-jbtb4-logo.webp") !important;}
          </style>'''
          if 'id="uploaded-upp-logo"' not in s:
              s=s.replace(marker,css+marker,1)
              p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use uploaded UPP JBTB 4 logo"
          git push
